services:
  nominatim:
    image: mediagis/nominatim:4.5
    container_name: startup-atlas-nominatim
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # All of India (Pune and Mumbai in Maharashtra, Bengaluru in Karnataka).
      # Geofabrik has no per-state extracts for India — maharashtra-latest
      # just redirects to its homepage — and the zone extracts split our
      # cities across western-zone and southern-zone, while this image only
      # imports one file. The India extract (~1.5GB) takes a few hours and
      # ~40GB disk to import; still far from the whole planet's days/~1TB.
      PBF_URL: https://download.geofabrik.de/asia/india-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/india-updates/
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD:-changeme}
      # Import speed vs. RAM tradeoff — 2 is a safe default for a laptop/
      # small VM; raise it if the host actually has the RAM to spare.
      THREADS: 2
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main
    shm_size: 1gb

volumes:
  nominatim-data:
