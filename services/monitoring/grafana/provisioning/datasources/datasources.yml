apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false

  # Business metrics straight from the app's own tables (review backlog,
  # ingestion runs, page views) — postgres_exporter only exposes DB-internal
  # stats (connections, cache hit ratio), not these, so Grafana's native
  # Postgres datasource + hand-written SQL panels is the right tool here.
  # $__env{...} is Grafana's documented provisioning syntax for pulling a
  # value from the container's own environment at startup — see this
  # compose file's `env_file: ../../.env` on the grafana service.
  - name: Startup Atlas DB (read-only)
    uid: startup-atlas-db
    type: postgres
    access: proxy
    url: $__env{MONITORING_PG_HOST}
    database: $__env{MONITORING_PG_DATABASE}
    user: $__env{MONITORING_PG_USER}
    secureJsonData:
      password: $__env{MONITORING_PG_PASSWORD}
    jsonData:
      sslmode: require
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
