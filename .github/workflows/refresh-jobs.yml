name: Refresh jobs

# Maintenance-phase job (CLAUDE.md §12/§7: "jobs = refresh_jobs re-visits
# careers pages, upserts new, expires unseen"), same shape as
# refresh-news.yml. Re-checks every published/probable brand's own website
# for a known ATS board (Greenhouse, Lever, Ashby, Workable, Recruitee,
# Keka, or SmartRecruiters — services/pipeline/src/lib/ats.ts) and upserts
# job_postings, tagging any walk-in-drive title (lib/walkin.ts). A brand
# whose careers page uses none of these (a white-labeled/custom board, or
# no visible ATS link at all) just correctly finds nothing — see the
# comment at the top of lib/ats.ts. Still runs daily so any brand that adds
# a supported board, or any newly-ingested brand that has one, starts
# showing real jobs automatically with zero manual work. Never touches
# brands/offices.

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC ≈ 09:00 IST daily — after refresh-news
  workflow_dispatch: {} # manual "Run workflow" button for on-demand refreshes

jobs:
  refresh-jobs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        city: [pune, mumbai]
      fail-fast: false # a bad run for one city shouldn't cancel the other
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh jobs for ${{ matrix.city }}
        run: pnpm --filter services-pipeline run refresh-jobs ${{ matrix.city }}
        env:
          # Repo Settings → Secrets and variables → Actions → New repository
          # secret. Use the same Neon/Supabase pooler URL as the local .env.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Aggregator APIs (Adzuna/Jooble) — covers the ~95% of companies that
      # run no machine-readable ATS board, so the step above can never see
      # them. Exits cleanly doing nothing if the key secrets aren't set, and
      # runs even if the ATS step failed since the two are independent.
      - name: Refresh aggregator jobs for ${{ matrix.city }}
        if: always()
        run: pnpm --filter services-pipeline run refresh-aggregator-jobs ${{ matrix.city }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
