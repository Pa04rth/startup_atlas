services:
  prometheus:
    build: ./prometheus # bakes prometheus.yml in at build time — see prometheus/Dockerfile
    container_name: startup-atlas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus

  grafana:
    build: ./grafana # bakes provisioning/ in at build time — see grafana/Dockerfile
    container_name: startup-atlas-grafana
    restart: unless-stopped
    ports:
      - "3001:3000" # apps/web already owns 3000 locally
    env_file:
      - ../../.env # MONITORING_PG_*/GRAFANA_ADMIN_PASSWORD — repo-root .env, same file everything else uses
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Infra-level DB health (connections, DB size, cache hit ratio, replication
  # lag) — business metrics (review backlog, ingestion runs) come from
  # Grafana's own Postgres datasource querying the app tables directly
  # (see grafana/provisioning/datasources), not through this exporter.
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: startup-atlas-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${MONITORING_DATABASE_URL}
    ports:
      - "9187:9187"

  # Host-level metrics (CPU/RAM/disk) for whatever machine runs the
  # pipeline's backfill — useful during a long ingestion run.
  node_exporter:
    image: prom/node-exporter:latest
    container_name: startup-atlas-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"

volumes:
  prometheus-data:
  grafana-data:
